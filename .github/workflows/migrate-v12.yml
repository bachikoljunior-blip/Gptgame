name: Apply Koeda v1.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koeda-v12-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested v1.2 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, json
          payload = ""
          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          for name, encoded in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('index.html').read_text(encoding='utf-8')
          assert 'source-v1.2' in source
          assert 'function toHiragana(' in source
          assert 'id="mic"' in source
          assert 'id="skip"' not in source
          scripts=re.findall(r'<script>([\s\S]*?)</script>',source)
          assert len(scripts)==1
          Path('/tmp/koeda-inline.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/koeda-inline.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md .github/workflows/quality.yml
          git commit -m 'feat: score spoken answers by kana reading'
          git push
