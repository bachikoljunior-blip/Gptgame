name: Apply Koeda v1.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koeda-v12-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested kana-scored game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          parts = [Path(f'.github/koeda-v12/part{i:02d}').read_text().strip() for i in range(7)]
          payload = ''.join(parts)
          expected = '8abe0c9bc695f6f7b96bf9bd1bf9c2819b04ebc7d763fc0df4a145986df64506'
          actual = hashlib.sha256(payload.encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual}')
          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          for name in ('index.html', 'README.md'):
              Path(name).write_bytes(base64.b64decode(files[name]))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('index.html').read_text(encoding='utf-8')
          required = ['source-v1.2','id="mic"','id="reset-input"','function toHiragana(','PROMPT_TARGETS={easy:75,normal:75,hard:60}','maxAlternatives=5']
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'missing: {missing}')
          forbidden = ['id="skip"','plateEnd','HOMOPHONES','キーで練習']
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit(f'forbidden: {found}')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', source)
          if len(scripts) != 1:
              raise SystemExit('inline script count')
          Path('/tmp/koeda-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/koeda-inline.js
          rm -rf .github/koeda-v12
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md .github/koeda-v12
          git commit -m 'feat: score spoken answers by kana reading'
          git push
