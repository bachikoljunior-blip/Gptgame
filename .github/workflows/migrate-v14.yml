name: Apply Koeda v1.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koeda-v13-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested auto-listening game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          parts = [Path(f'.github/koeda-v14/part{i:02d}').read_text().strip() for i in range(5)]
          payload = ''.join(parts)
          expected = 'e8b410cb6cc9ae5326c0e2c0a6fd4af52b855c7e872b561ec0b78e4ebfa77052'
          actual = hashlib.sha256(payload.encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual}')

          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          for name, encoded in files.items():
              Path(name).write_bytes(base64.b64decode(encoded))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('index.html').read_text(encoding='utf-8')
          required = [
              'source-v1.3', 'id="mic"', 'id="answer-review"',
              'id="diff-target"', 'id="diff-answer"', 'id="next-prompt"',
              'function requestMicPermission()', 'function beginPrompt()',
              'function kanaCount(', 'function alignReadings(',
              'PROMPT_TARGETS={easy:150,normal:150,hard:120}',
              'RESULT_HOLD_MS=2600', 'state.correctChars+=best.matchedKana',
              'body.playing{height:100dvh;overflow:hidden', 'maxAlternatives=5'
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit(f'missing markers: {missing}')

          forbidden = ['id="skip"', 'plateEnd', 'HOMOPHONES', 'キーで練習', 'confirm(']
          found = [marker for marker in forbidden if marker in source]
          if found:
              raise SystemExit(f'forbidden markers: {found}')

          scripts = re.findall(r'<script>([\s\S]*?)</script>', source)
          if len(scripts) != 1:
              raise SystemExit('inline script count')
          Path('/tmp/koeda-inline.js').write_text(scripts[0], encoding='utf-8')
          print(f'Koeda v1.3 source OK; {len(source.encode())} bytes')
          PY
          node --check /tmp/koeda-inline.js
          rm -rf .github/koeda-v14
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md
          git add -A .github/koeda-v14
          git commit -m 'feat: auto-start microphone and show kana mistakes'
          git push
