name: Deploy Koeda to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare revision-stamped site
        env:
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p _site
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          source = Path('index.html').read_text(encoding='utf-8')
          revision = os.environ['REVISION']
          stamped, count = re.subn(
              r'(<meta name="app-revision" content=")[^"]*(">)',
              rf'\g<1>{revision}\g<2>', source, count=1
          )
          if count != 1:
              raise SystemExit('app-revision marker not found exactly once')
          Path('_site/index.html').write_text(stamped, encoding='utf-8')
          Path('_site/.nojekyll').write_text('', encoding='utf-8')
          Path('_site/version.json').write_text(
              json.dumps({'name': '声打', 'revision': revision}, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the branch-based Pages publisher
        uses: actions/github-script@v7
        with:
          script: |
            const pollMs = 3000;
            const discoveryDeadline = Date.now() + 60000;
            const completionDeadline = Date.now() + 180000;
            let legacyRun;

            while (!legacyRun && Date.now() < discoveryDeadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
                per_page: 100,
              });
              legacyRun = response.data.workflow_runs.find(
                (run) => run.name === 'pages build and deployment',
              );
              if (!legacyRun) await new Promise((resolve) => setTimeout(resolve, pollMs));
            }

            if (!legacyRun) {
              core.notice('No branch-based Pages publisher was found; continuing.');
              return;
            }

            while (legacyRun.status !== 'completed') {
              if (Date.now() >= completionDeadline) {
                throw new Error(`Timed out waiting for legacy Pages run ${legacyRun.id}`);
              }
              core.info(`Waiting for legacy Pages run ${legacyRun.id}: ${legacyRun.status}`);
              await new Promise((resolve) => setTimeout(resolve, pollMs));
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: legacyRun.id,
              });
              legacyRun = response.data;
            }

            core.info(`Legacy Pages run ${legacyRun.id} finished with ${legacyRun.conclusion}.`);
      - name: Deploy verified artifact after the legacy publisher
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the real public revision and primary surface
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          BASE_URL="${PAGE_URL%/}/"
          for attempt in $(seq 1 36); do
            curl -fsSL -H 'Cache-Control: no-cache' \
              "${BASE_URL}version.json?revision=${EXPECTED_REVISION}&attempt=${attempt}" \
              -o /tmp/koeda-version.json || true
            curl -fsSL -H 'Cache-Control: no-cache' \
              "${BASE_URL}?revision=${EXPECTED_REVISION}&attempt=${attempt}" \
              -o /tmp/koeda-public.html || true
            if grep -Fq "${EXPECTED_REVISION}" /tmp/koeda-version.json 2>/dev/null \
              && grep -Fq "content=\"${EXPECTED_REVISION}\"" /tmp/koeda-public.html 2>/dev/null \
              && grep -Fq 'id="start"' /tmp/koeda-public.html \
              && grep -Fq '<title>声打' /tmp/koeda-public.html; then
              echo "Verified public revision ${EXPECTED_REVISION}"
              exit 0
            fi
            sleep 5
          done
          echo 'Public surface did not serve the expected revision' >&2
          echo 'version.json:' >&2
          cat /tmp/koeda-version.json >&2 2>/dev/null || true
          echo 'app-revision marker:' >&2
          grep -o 'meta name="app-revision" content="[^"]*"' /tmp/koeda-public.html >&2 2>/dev/null || true
          exit 1
