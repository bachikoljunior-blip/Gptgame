name: Deploy Koeda to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare revision-stamped site
        env:
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p _site
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          source = Path('index.html').read_text(encoding='utf-8')
          revision = os.environ['REVISION']
          stamped, count = re.subn(
              r'(<meta name="app-revision" content=")[^"]*(">)',
              rf'\g<1>{revision}\g<2>', source, count=1
          )
          if count != 1:
              raise SystemExit('app-revision marker not found exactly once')
          Path('_site/index.html').write_text(stamped, encoding='utf-8')
          Path('_site/.nojekyll').write_text('', encoding='utf-8')
          Path('_site/version.json').write_text(
              json.dumps({'name': '声打', 'revision': revision}, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the real public revision and primary surface
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            curl -fsSL "${PAGE_URL}?revision=${EXPECTED_REVISION}&attempt=${attempt}" -o /tmp/koeda-public.html || true
            if grep -Fq "content=\"${EXPECTED_REVISION}\"" /tmp/koeda-public.html 2>/dev/null \
              && grep -Fq 'id="start"' /tmp/koeda-public.html \
              && grep -Fq '<title>声打' /tmp/koeda-public.html; then
              echo "Verified public revision ${EXPECTED_REVISION}"
              exit 0
            fi
            sleep 5
          done
          echo "Public surface did not serve the expected revision" >&2
          exit 1
