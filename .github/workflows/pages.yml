name: Test and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - package.json
      - tests/**
      - scripts/**
      - AI_DEVELOPMENT/F9_DEPLOY_PROBE
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    outputs:
      rollback_revision: ${{ steps.rollback.outputs.revision }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game checks
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -f index.html
          node scripts/verify-continuity.mjs
          node scripts/verify-floor.mjs
          npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble static site
        run: |
          mkdir -p _site
          REVISION_ID="${GITHUB_SHA}" node scripts/prepare-release.mjs index.html _site/index.html
      - name: Assemble verified rollback site
        id: rollback
        run: node scripts/prepare-rollback.mjs AI_DEVELOPMENT/STATE.yaml _rollback/index.html
      - name: Execute verified rollback site
        env:
          ROLLBACK_ARTIFACT: "1"
          GAME_HTML: _rollback/index.html
        run: npm test
      - name: Upload tested candidate
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site
      - name: Upload verified rollback
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-rollback
          path: _rollback

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for branch-based Pages publisher
        uses: actions/github-script@v7
        with:
          script: |
            const pollMs = 3000;
            const discoveryDeadline = Date.now() + 30000;
            const completionDeadline = Date.now() + 120000;
            let legacyRun;

            while (!legacyRun && Date.now() < discoveryDeadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
                per_page: 100,
              });
              legacyRun = response.data.workflow_runs.find(
                (run) => run.name === "pages build and deployment",
              );
              if (!legacyRun) await new Promise((resolve) => setTimeout(resolve, pollMs));
            }

            if (!legacyRun) {
              core.notice("No branch-based Pages publisher found; continuing with the tested deployment.");
              return;
            }

            while (legacyRun.status !== "completed") {
              if (Date.now() >= completionDeadline) {
                throw new Error(`Timed out waiting for legacy Pages run ${legacyRun.id}`);
              }
              core.info(`Waiting for legacy Pages run ${legacyRun.id}: ${legacyRun.status}`);
              await new Promise((resolve) => setTimeout(resolve, pollMs));
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: legacyRun.id,
              });
              legacyRun = response.data;
            }

            core.info(`Legacy Pages run ${legacyRun.id} completed with ${legacyRun.conclusion}.`);
      - name: Deploy candidate to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify served revision and primary runtime
        env:
          PUBLIC_OUTPUT_FILE: /tmp/gptgame-public-index.html
        run: |
          EXPECTED_REVISION="${GITHUB_SHA}"
          if test -f AI_DEVELOPMENT/F9_DEPLOY_PROBE; then
            EXPECTED_REVISION="0000000000000000000000000000000000000000"
          fi
          node scripts/verify-public-revision.mjs "${{ steps.deployment.outputs.page_url }}" "${EXPECTED_REVISION}"
          GAME_HTML=/tmp/gptgame-public-index.html npm test
      - name: Automatically restore verified public revision
        id: rollback
        if: ${{ failure() && steps.deployment.outcome == 'success' }}
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback
      - name: Verify automatic restoration
        if: ${{ failure() && steps.rollback.outcome == 'success' }}
        env:
          PUBLIC_OUTPUT_FILE: /tmp/gptgame-rollback-index.html
          ROLLBACK_ARTIFACT: "1"
          GAME_HTML: /tmp/gptgame-rollback-index.html
        run: |
          node scripts/verify-public-revision.mjs "${{ steps.rollback.outputs.page_url }}" "${{ needs.test.outputs.rollback_revision }}"
          npm test
