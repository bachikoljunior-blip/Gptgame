name: Koeda quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the self-contained game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('index.html').read_text(encoding='utf-8')
          required = [
              '<title>声打', 'id="start"', 'id="game"', 'id="result"',
              'SpeechRecognition', 'localStorage', 'data-mode="voice"',
              'data-mode="keyboard"', 'meta name="app-revision"'
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'Missing required markers: {missing}')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', source)
          if len(scripts) != 1 or re.search(r'<script[^>]+src=', source):
              raise SystemExit('Expected exactly one inline script and no external script')
          if len(source.encode('utf-8')) > 120_000:
              raise SystemExit('Game exceeds the 120 KB source budget')
          Path('/tmp/koeda-inline.js').write_text(scripts[0], encoding='utf-8')
          print(f'HTML markers OK; {len(source.encode("utf-8"))} bytes')
          PY
          node --check /tmp/koeda-inline.js
