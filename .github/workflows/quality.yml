name: Koeda quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the self-contained kana-scored game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('index.html').read_text(encoding='utf-8')
          required=['<title>声打','source-v1.2','id="start"','id="game"','id="result"','id="mic"','id="reset-input"','function toHiragana(','function compareReadings(','PROMPT_TARGETS={easy:75,normal:75,hard:60}','maxAlternatives=5','localStorage']
          missing=[x for x in required if x not in source]
          if missing: raise SystemExit(f'Missing markers: {missing}')
          forbidden=['id="skip"','plateEnd','HOMOPHONES','キーで練習','keyboard-form','data-mode="keyboard"']
          found=[x for x in forbidden if x in source]
          if found: raise SystemExit(f'Removed behavior returned: {found}')
          scripts=re.findall(r'<script>([\s\S]*?)</script>',source)
          if len(scripts)!=1 or re.search(r'<script[^>]+src=',source): raise SystemExit('Expected one inline script')
          if len(source.encode())>120000: raise SystemExit('Source budget exceeded')
          Path('/tmp/koeda-inline.js').write_text(scripts[0],encoding='utf-8')
          print(f'Kana-scored voice game OK; {len(source.encode())} bytes')
          PY
          node --check /tmp/koeda-inline.js
