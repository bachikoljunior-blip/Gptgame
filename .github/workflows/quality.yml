name: Project quality gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore exact dependencies
        run: npm ci
      # Before the gates themselves: a silently inert gate and a passing gate both print
      # nothing and exit 0, so the gate is proved able to fail first.
      - name: Prove the continuity gate can fail
        run: node scripts/verify-continuity.mjs --selftest
      - name: Verify the vendored kit has not drifted
        run: npm run check:kit
      - name: Verify continuity loader
        run: node scripts/verify-continuity.mjs
      - name: Enforce state and review record
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-floor.mjs
      - name: Execute game tests
        run: npm test
