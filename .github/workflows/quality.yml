name: Koeda quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the self-contained voice game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('index.html').read_text(encoding='utf-8')
          required = [
              '<title>声打', 'id="start"', 'id="game"', 'id="result"',
              'id="reset-input"', 'SpeechRecognition', 'localStorage',
              'HOMOPHONES', '同音の表記ゆれも正解',
              'meta name="app-revision"', 'source-v1.1',
              'function resetInput()', 'function variants(p)'
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'Missing required markers: {missing}')

          if not re.search(r'maxAlternatives\s*=\s*5', source):
              raise SystemExit('Speech recognition must expose five alternatives')

          forbidden = [
              'data-mode="keyboard"', 'data-input="keyboard"', 'キーで練習',
              'keyboard-form', 'class="keyboard"', 'state.mode', "$('#form')", "$('#input')"
          ]
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit(f'Removed keyboard mode returned: {found}')

          reset = re.search(r'function resetInput\(\)\{([\s\S]*?)\}\nfunction startRec', source)
          if not reset:
              raise SystemExit('Could not isolate resetInput implementation')
          reset_body = reset.group(1)
          reset_required = ['stopRec()', "state.buffer=''", 'startRec()']
          reset_missing = [item for item in reset_required if item not in reset_body]
          if reset_missing:
              raise SystemExit(f'Reset no longer restarts clean recognition: {reset_missing}')
          reset_forbidden = ['state.score=', 'state.combo=', 'state.index=', 'state.plateEnd=', 'state.end=']
          reset_damage = [item for item in reset_forbidden if item in reset_body]
          if reset_damage:
              raise SystemExit(f'Reset changed protected game state: {reset_damage}')

          scripts = re.findall(r'<script>([\s\S]*?)</script>', source)
          if len(scripts) != 1 or re.search(r'<script[^>]+src=', source):
              raise SystemExit('Expected exactly one inline script and no external script')
          size = len(source.encode('utf-8'))
          if size > 120_000:
              raise SystemExit(f'Game exceeds the 120 KB source budget: {size}')
          Path('/tmp/koeda-inline.js').write_text(scripts[0], encoding='utf-8')
          print(f'Voice-only HTML markers OK; {size} bytes')
          PY
          node --check /tmp/koeda-inline.js
